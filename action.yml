name: 'AuthorMark Authorship Watermark'
description: 'Zero-dependency layered authorship watermarking, verification, and code provenance'
inputs:
  path:
    description: 'Path or root directory to check or stamp (default: .)'
    default: '.'
  mode:
    description: 'Execution mode: check-presence (default), check, stamp, verify, or custom'
    default: 'check-presence'
  key:
    description: 'AuthorMark HMAC secret key (optional, for check/stamp/verify)'
    default: ''
  args:
    description: 'Additional flags and arguments passed to authormark.mjs'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Restore AuthorMark key
      if: ${{ inputs.key != '' }}
      shell: bash
      env:
        AUTHORMARK_KEY: ${{ inputs.key }}
      run: |
        mkdir -p "$HOME"
        printf "%s" "$AUTHORMARK_KEY" > "$HOME/.authormark.key"
        chmod 600 "$HOME/.authormark.key" 2>/dev/null || true

    - name: Run AuthorMark
      shell: bash
      run: |
        CMD="node ${{ github.action_path }}/authormark.mjs"
        case "${{ inputs.mode }}" in
          check-presence) $CMD check --presence ${{ inputs.path }} ${{ inputs.args }} ;;
          check)          $CMD check ${{ inputs.path }} ${{ inputs.args }} ;;
          stamp)          $CMD stamp ${{ inputs.path }} ${{ inputs.args }} ;;
          verify)         $CMD verify ${{ inputs.args }} ;;
          custom)         $CMD ${{ inputs.args }} ;;
          *)              echo "::error::Unknown mode: ${{ inputs.mode }}"; exit 1 ;;
        esac
