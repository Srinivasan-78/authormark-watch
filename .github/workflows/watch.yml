name: Security & Repo Watch

on:
  schedule:
    # Twice weekly on Monday and Thursday at 06:17 UTC.
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Specific repository to scan (leave blank for all)'
        type: string
        default: ''
      skip_osv:
        description: 'Skip live OSV dependency CVE lookup'
        type: boolean
        default: false

concurrency:
  group: repo-security-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Run cross-repo monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WATCH_TOKEN: ${{ secrets.WATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.WATCH_TOKEN }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          SKIP_OSV: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_osv && '1' || '0' }}
        run: |
          chmod +x ./watch.sh
          FLAGS=()
          [ -n "$TARGET_REPO" ] && FLAGS+=(--repo "$TARGET_REPO")
          ./watch.sh "${FLAGS[@]}"
