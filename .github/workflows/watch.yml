name: authormark watch

on:
  schedule:
    # Daily at 06:17 UTC. Off-the-hour so it isn't queued behind everyone else's cron.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      fix:
        description: 'Open a fix PR on every repo that is unmarked or drifted'
        type: boolean
        default: false

# A manual run and the nightly cron overlapping would open the same fix PR twice.
concurrency:
  group: authormark-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # A hung clone should not sit on a runner for the default six hours.
    timeout-minutes: 20
    # Only for the status issue in this repo; every cross-repo call uses the PAT.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Scan every repo for intact authorship watermarks
        env:
          # A PAT, not GITHUB_TOKEN: the built-in token can only see this repo.
          # BOT_TOKEN, when set, is the bot account's token -- the PRs are opened
          # by whoever owns the token used here.
          GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.WATCH_TOKEN }}
          # The status issue is filed in this repo, which the PAT above is often
          # not scoped to see. The built-in token always can.
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed for FIX=1: fingerprints are HMACs of the file contents.
          AUTHORMARK_KEY: ${{ secrets.AUTHORMARK_KEY }}
          FIX: ${{ inputs.fix && '1' || '0' }}
        run: ./watch.sh
