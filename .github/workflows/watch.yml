name: Master Bot Supervisor

on:
  schedule:
    # Weekly on Monday at 06:17 UTC. Off-the-hour so it isn't queued behind everyone else's cron.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      fix:
        description: 'Open fix PRs on repos that are unmarked, drifted, or require hygiene fixes'
        type: boolean
        default: true
      tag_prs:
        description: 'Automatically tag and label open PRs across all repos'
        type: boolean
        default: true
      tag_issues:
        description: 'Automatically triage and tag open issues across all repos'
        type: boolean
        default: true
      lint:
        description: 'Run multi-language code linting and hygiene scan'
        type: boolean
        default: true
      provenance:
        description: 'Scaffold REUSE headers + provenance workflow, harden workflows, and (with fix) require signed commits'
        type: boolean
        default: true
      target_repo:
        description: 'Specific repository to target (leave blank to supervise all repos)'
        type: string
        default: ''

# A manual run and the weekly cron overlapping would open duplicate fix PRs or race tags.
concurrency:
  group: authormark-master-bot
  cancel-in-progress: false

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Master Bot Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '24'

      - name: Run Master Bot Account Supervisor
        env:
          # A PAT with repo/issues/pull-requests scope across all repos.
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WATCH_TOKEN: ${{ secrets.WATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.WATCH_TOKEN }}
          # The status dashboard issue is filed in this repo using GITHUB_TOKEN.
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HMAC key for AuthorMark code signing / stamping in FIX mode.
          AUTHORMARK_KEY: ${{ secrets.AUTHORMARK_KEY }}
          FIX: ${{ inputs.fix == false && '0' || '1' }}
        run: |
          chmod +x ./watch.sh
          FLAGS=(--all --fix)
          [ "${{ inputs.fix || 'true' }}" = "false" ] && FLAGS=(--all)
          [ "${{ inputs.lint || 'true' }}" = "true" ] && FLAGS+=(--lint)
          [ "${{ inputs.provenance || 'true' }}" = "true" ] && FLAGS+=(--provenance)
          [ "${{ inputs.tag_prs || 'true' }}" = "true" ] && FLAGS+=(--tag-prs)
          [ "${{ inputs.tag_issues || 'true' }}" = "true" ] && FLAGS+=(--tag-issues)
          [ -n "${{ inputs.target_repo }}" ] && FLAGS+=(--repo "${{ inputs.target_repo }}")
          ./watch.sh "${FLAGS[@]}"
