name: Dependabot Auto-Merge

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview Dependabot PR actions without merging or commenting'
        type: boolean
        default: false
      target_repo:
        description: 'Specific repository (leave blank for all)'
        type: string
        default: ''

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build release binary
        run: cargo build --release
      - name: Process Dependabot PRs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WATCH_TOKEN: ${{ secrets.WATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.WATCH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_REPO: ${{ inputs.target_repo }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          FLAGS=(--dependabot --public-only)
          [ "$DRY_RUN" = "1" ] && FLAGS+=(--dry-run)
          [ -n "$TARGET_REPO" ] && FLAGS+=(--repo "$TARGET_REPO")
          ./target/release/authormark-watch "${FLAGS[@]}"
